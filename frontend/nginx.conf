server {
    listen 80;
    server_name _;

    # ── React SPA ─────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ─────────────────────────────────────────
    # The React app sends requests to /api/...
    # nginx strips /api and forwards to the backend container on port 8000.
    #
    # Example:
    #   Browser  GET  /api/dashboard
    #   → nginx  GET  http://backend:8000/dashboard
    location /api/ {
        proxy_pass         http://backend:8000/;  # trailing slash strips /api prefix
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-XSS-Protection        "1; mode=block"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain text/css application/json
        application/javascript text/javascript
        text/xml application/xml;
    gzip_min_length 1024;
}
